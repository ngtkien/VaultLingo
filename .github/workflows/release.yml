name: Release Build & Packaging

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            pkg_name: vaultlingo-linux-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            pkg_name: vaultlingo-macos-arm64

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install Linux Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Build Desktop GUI & CLI Binaries
        run: |
          wails build -platform ${{ matrix.goos }}/${{ matrix.goarch }}
          go build -ldflags="-s -w" -o build/bin/vl ./cmd/vl

      - name: Package Distribution Bundle
        run: |
          mkdir -p dist/${{ matrix.pkg_name }}
          cp -r build/bin/* dist/${{ matrix.pkg_name }}/
          cp vaultlingo.desktop dist/${{ matrix.pkg_name }}/ 2>/dev/null || true
          cp frontend/src/assets/images/pegasus-logo.png dist/${{ matrix.pkg_name }}/vaultlingo.png 2>/dev/null || true
          cp scripts/install.sh dist/${{ matrix.pkg_name }}/install.sh 2>/dev/null || true
          chmod +x dist/${{ matrix.pkg_name }}/install.sh 2>/dev/null || true
          
          cd dist
          tar -czvf ${{ matrix.pkg_name }}.tar.gz ${{ matrix.pkg_name }}
          cd ..

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
